server:
  port: 8081

spring:
  application:
    name: UserApp

  profiles:
    active:
      - default

  config:
    #import: optional:configserver:lb://ConfigServer
    import: configserver:http://localhost:8085

  datasource:
    url: jdbc:mysql://root@localhost:3306/microservice
    username: root
    password: Avyaan@123

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate.format_sql: true

management:
  health:
    circuitbreakers:
      enabled: true
  endpoints:
    web:
      exposure:
        include:
          - health
  endpoint:
    health:
      show-details: ALWAYS

resilience4j:
  circuitbreaker:
    instances:
      ratingHotelBreaker:
        register-health-indicator: true
        event-consumer-buffer-size: 5
        failure-rate-threshold: 10
        minimum-number-of-calls: 5
        wait-duration-in-open-state: 5s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        sliding-window-size: 2
        sliding-window-type: COUNT_BASED

  retry:
    instances:
      ratingHotelRetry:
        wait-duration: 1s
        max-attempts: 3

  ratelimiter:
    instances:
      userRateLimiter:
        timeout-duration: 0s
        limit-for-period: 2
        limit-refresh-period: 4s

